# 项目级 Reasonix 配置（覆盖 ~/.reasonix/config.toml 中的同名项）
# 优先级: flag > ./reasonix.toml > ~/.reasonix/config.toml > built-in defaults
# 说明: ~/.reasonix 为只读挂载，无法修改全局配置，故以项目级配置覆盖。

[agent]
tool_result_snip_ratio = 0.4   # 压缩前将过期工具结果截断到 40%（原全局 0.6），更省 token
keep                   = ["errors"]   # 压缩时保留错误信息，避免重复失败循环
recent_keep            = 2   # 压缩时保留最近 2 条消息原文
output_style           = "concise"   # 输出风格更简短，节省 completion token

[bot]
max_steps = 5   # bot 网关（IM）步数上限，配置层 max_steps 唯一位置；当前全局 bot.enabled=false

[permissions]
allow = ["Bash=mkdir -p /tmp/pgcheck && cd /tmp/pgcheck && PGJAR=$(find /home/ovaphlow/.gradle -name \"postgresql-42.7.4.jar\" | head -1) && cat > ApplyV504.java <<'EOF'\nimport java.sql.*;\nimport java.nio.file.*;\npublic class ApplyV504 {\n  public static void main(String[] a) throws Exception {\n    String pwd = System.getenv(\"PITCHFORK_DB_PASSWORD\");\n    String sql = Files.readString(Path.of(a[0]));\n    try (Connection c = DriverManager.getConnection(\"jdbc:postgresql://localhost:5432/aceso\", \"ovaphlow\", pwd);\n         Statement s = c.createStatement()) {\n      s.execute(sql);\n      ResultSet rs = s.executeQuery(\"select indexname from pg_indexes where schemaname='healthcare' and indexname like '%elderly_handover%'\");\n      System.out.print(\"INDEXES:\");\n      while (rs.next()) System.out.print(\" \" + rs.getString(1));\n      System.out.println();\n    } catch (Exception e) { System.out.println(\"FAIL \" + e.getMessage()); System.exit(1); }\n  }\n}\nEOF\njavac -cp \"$PGJAR\" ApplyV504.java && source /home/ovaphlow/pitchfork/service-vertx-kotlin/.env && export PITCHFORK_DB_PASSWORD && java -cp \"$PGJAR:.\" ApplyV504 /home/ovaphlow/pitchfork/service-vertx-kotlin/libs/healthcare/src/main/resources/db/migration/V504__add_elderly_discharge_handover_archive.sql"]
