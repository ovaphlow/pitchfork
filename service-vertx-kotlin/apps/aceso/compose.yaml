# Podman Compose — PostgreSQL 17 for aceso
# Uses PITCHFORK_DB_PASSWORD from the shell or a local .env file
# Usage: podman-compose up -d   or   podman compose up -d

services:
  pitchfork-aceso-db:
    image: postgres:18
    container_name: pitchfork-aceso-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ovaphlow
      POSTGRES_PASSWORD: "${PITCHFORK_DB_PASSWORD:?PITCHFORK_DB_PASSWORD must be set}"
    volumes:
      - ./.data/pg:/var/lib/postgresql:Z
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovaphlow -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
